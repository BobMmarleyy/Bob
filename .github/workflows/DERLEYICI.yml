# Bob CloudStream — tüm eklentileri derler ve 'builds' dalına yayınlar.
name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "KONTROL.py"
      - "auto_update.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name : "Kaynak Depo Kontrolü"
        uses : actions/checkout@v4
        with :
          path : src

      - name : "'builds' Dizinini Hazırla"
        run : |
          cd "$GITHUB_WORKSPACE"
          if [ -n "$(git ls-remote --heads "https://github.com/$REPO_OWNER/$REPO_NAME.git" builds)" ]; then
            git clone --depth 1 --branch builds \
              "https://github.com/$REPO_OWNER/$REPO_NAME.git" builds
          else
            mkdir -p builds && cd builds && git init -b builds
            git remote add origin "https://github.com/$REPO_OWNER/$REPO_NAME.git"
          fi

      - name : Eski Derlemeleri Temizle
        run : rm -f "$GITHUB_WORKSPACE"/builds/*.cs3 || true

      - name : JDK 23 Ayarla
        uses : actions/setup-java@v4
        with :
          distribution: temurin
          java-version: "23"

      - name : Android SDK Ayarla
        uses : android-actions/setup-android@v3

      - name : Eklentileri Derle
        run : |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace
          find "$GITHUB_WORKSPACE/src" -path "*/build/*.cs3" \
            -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          cp "$GITHUB_WORKSPACE/src/build/plugins.json" "$GITHUB_WORKSPACE/builds/"

      - name : Derlemeleri Yükle
        run : |
          cd "$GITHUB_WORKSPACE/builds"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            if git rev-parse HEAD >/dev/null 2>&1; then
              git commit --amend -m "$GITHUB_SHA 'nın Derlenmesi" --no-verify
            else
              git commit -m "$GITHUB_SHA 'nın Derlenmesi"
            fi
          fi
          git push --force origin builds
