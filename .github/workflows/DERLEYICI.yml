name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "KONTROL.py"
      - "auto_update.py"
      - "kontrol_rapor.json"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create builds branch if not exists
        run: |
          cd src
          if ! git ls-remote --exit-code --heads origin builds >/dev/null 2>&1; then
            git checkout -b builds
            git push origin builds
            git checkout main
          fi
        continue-on-error: true

      - name: Clean old builds
        run: |
          rm -f builds/*.cs3
          rm -f builds/*.jar
          rm -f builds/plugins.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build Plugins
        run: |
          cd src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          shopt -s globstar nullglob
          cp **/build/*.cs3 ../builds/ || true
          cp **/build/*.jar ../builds/ || true
          cp build/plugins.json ../builds/

      - name: Commit and push builds
        run: |
          cd builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build ${{ github.sha }}" || echo "No changes to commit"
          git push origin builds
